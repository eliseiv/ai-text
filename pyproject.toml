[project]
name = "service-template"
version = "0.1.0"
description = "Reusable backend core (auth, billing, wallet, policy, generation plugin). Domain lives in src/app/domain."
requires-python = ">=3.12"
# CORE dependencies only. A new service adds ITS OWN deps here —
# that is the only edit of this file a domain is allowed to make. Deliberately absent:
# anthropic / openai / pypdf / python-multipart / KMS — intentionally not part of the template.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23,<24",
    "pydantic>=2.9,<2.10",
    # pydantic EmailStr (CloudPayments checkout request) needs email-validator at runtime.
    "email-validator>=2,<3",
    "pydantic-settings>=2.5,<2.6",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "redis>=5,<6",
    # App Store Server API, broadapps checkout/verify, outgoing HTTP of the default provider.
    "httpx[socks]>=0.27,<0.28",
    # JWT: our RS256 issuer, Apple identity token (OIDC), StoreKit JWS.
    "pyjwt[crypto]>=2.9,<2.10",
    # StoreKit JWS: x5c chain parsing, verification up to the Apple root CA.
    "cryptography>=43,<44",
    "prometheus-client>=0.21,<0.22",
    # tz database for zoneinfo on the slim runtime image (python:3.12-slim-bookworm ships none).
    "tzdata>=2024.1",
    "pypdf>=5,<7",
    "trafilatura>=2,<3",
    "python-multipart>=0.0.12,<0.1",
    "openai>=1.51,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<1.12",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5,<6",
    "testcontainers>=4,<5",
    "respx>=0.21,<0.22",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# strict = true where a bug costs money or access:
# policy, wallet, auth, generation and every billing* package. `app.domain.*` is NOT strict —
# the domain sets its own bar.
[[tool.mypy.overrides]]
module = [
    "app.policy.*",
    "app.wallet.*",
    "app.auth.*",
    "app.generation.*",
    "app.billing.*",
    "app.billing_common.*",
    "app.billing_adapty.*",
    "app.billing_cloudpayments.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "external: tests that hit real external services. Excluded from CI; run on demand.",
]

[tool.coverage.run]
source = ["src"]
# SQLAlchemy's asyncio layer resumes our coroutines across GREENLET switches (greenlet_spawn).
# Without this, coverage silently loses every line of an async function that awaits the DB — whole
# service bodies (auth, generation, billing) were reported as unexecuted although the integration
# tests drive them end to end. A coverage gate computed on that data measures nothing.
concurrency = ["greenlet", "thread"]
