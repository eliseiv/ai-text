# Deploy to the shared server behind the external Traefik (/opt/edge) over SSH.
#
# WHEN: automatically after every push to `main` — but only once the `ci` workflow for that push
# has finished GREEN (`workflow_run` + `conclusion == success`), so a red build is never shipped.
# Manual re-deploy of the current `main`: Actions → deploy → Run workflow.
#
# WHAT (on the server, in /opt/gelnora, compose project `gelnora`):
#   1. check out EXACTLY the commit CI tested (never an older one — no accidental rollback);
#   2. `compose build api migrate`   — the image is built on the server (no registry);
#   3. `compose run --rm migrate`    — alembic upgrade head, BEFORE the new api starts;
#   4. `compose up -d --no-build`    — api + worker (+ postgres/redis); rc NOT trusted;
#   5. readiness gate: `gelnora-api-1` healthy (GET /ready: db + redis) and the worker running;
#   6. public smoke `https://$SERVICE_DOMAIN/healthz` through Traefik (non-fatal: DNS/ACME).
# Traefik itself is never touched: routing comes from the api container labels.
#
# GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY. Application secrets live in
# /opt/gelnora/.env on the server (gitignored), never in the repository or the image.
#
# ROLLBACK: on the server — cd /opt/gelnora && git log --oneline -n 5 && git checkout -B main <sha>
# then steps 2–4 by hand (see infra/deploy/README.md). The schema is not reverted (expand-only).

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/gelnora
  COMPOSE_PROJECT: gelnora

jobs:
  deploy:
    name: ssh deploy → gelnora.shop
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    environment: production
    steps:
      - name: Deploy over SSH
        # PINNED BY COMMIT SHA, not by tag: this action receives the production SSH key, and a
        # mutable tag could be re-pointed by a compromised upstream. Upgrade = resolve the new tag
        # (`git ls-remote https://github.com/appleboy/ssh-action refs/tags/<tag>`), review, bump.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        env:
          # The commit CI tested (workflow_run) or the current main head (manual run).
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,DEPLOY_DIR,COMPOSE_PROJECT
          command_timeout: 30m
          # `script_stop: true` would inject `set -e`; failures are handled by explicit rc checks.
          script_stop: false
          script: |
            set -uo pipefail
            proj="$COMPOSE_PROJECT"
            dc() { docker compose -p "$proj" -f docker-compose.prod.yml --env-file .env "$@"; }
            fail() { echo "::error title=Deploy failed::$1"; exit 1; }

            cd "$DEPLOY_DIR" || fail "$DEPLOY_DIR missing — provision the instance first"
            [ -f .env ] || fail "$DEPLOY_DIR/.env missing"

            echo "[deploy] fetch"
            git fetch --prune origin || fail "git fetch failed"
            target="${DEPLOY_SHA:-$(git rev-parse origin/main)}"
            current="$(git rev-parse HEAD)"
            # Never move BACKWARDS: an out-of-order run for an older commit must not roll prod back.
            if [ "$current" != "$target" ] && git merge-base --is-ancestor "$target" "$current"; then
              echo "::warning title=Skipped::$target is older than the deployed $current — nothing to do"
              exit 0
            fi
            git checkout -q -B main "$target" || fail "checkout $target failed"
            echo "[deploy] at $(git log --oneline -1)"

            echo "[deploy] build (image built on the server)"
            dc build api migrate || fail "docker compose build failed"

            echo "[deploy] migrate (alembic upgrade head) — before the new api starts"
            dc run --rm migrate || fail "migration failed"

            echo "[deploy] up -d --no-build (rc informational; the readiness gate decides)"
            up_rc=0; dc up -d --no-build --remove-orphans || up_rc=$?
            echo "[deploy] up rc=$up_rc"

            echo "[deploy] readiness gate: ${proj}-api-1 healthy (60 x 2s)"
            ready=0
            for i in $(seq 1 60); do
              h="$(docker inspect "${proj}-api-1" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
              [ "$h" = "healthy" ] && { ready=1; echo "[deploy] api healthy ($i)"; break; }
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              docker logs "${proj}-api-1" --tail 60 2>&1 || true
              fail "api did not become healthy (up rc=$up_rc)"
            fi
            w="$(docker inspect "${proj}-worker-1" --format '{{.State.Status}}' 2>/dev/null || echo none)"
            if [ "$w" != "running" ]; then
              docker logs "${proj}-worker-1" --tail 60 2>&1 || true
              fail "worker is not running (state=$w)"
            fi

            domain="$(grep -E '^SERVICE_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d "\"' ")"
            if [ -n "$domain" ]; then
              url="https://$domain/healthz"
              ok=0
              for i in $(seq 1 12); do
                curl -fsS --max-time 5 "$url" >/dev/null && { ok=1; echo "[smoke] $url OK"; break; }
                sleep 5
              done
              [ "$ok" -eq 1 ] || echo "::warning title=Smoke not green::$url did not answer 200 within 60s (DNS / Let's Encrypt may still be settling); the api is healthy in-container."
            fi

            docker image prune -f >/dev/null 2>&1 || true
            echo "[deploy] done: $(git log --oneline -1)"
