# MANUAL / out-of-band deploy — shared server + external Traefik over SSH.
#
# The PRIMARY, automatic deploy on push to main is the `deploy` JOB inside
# .github/workflows/ci.yml, gated by `needs: [quality, test, alerts, build-image]` so it cannot start
# until the whole CI suite is green. This file is `workflow_dispatch` ONLY — for a manual redeploy
# (e.g. re-run after DNS/cert settle, or redeploy the current main HEAD without a new commit).
# Do NOT add a `push` trigger here, or deploy will again race CI and can ship a red build.
#
# The deploy steps are IDENTICAL to the gated job in ci.yml (same hardened logic: split
# build/migrate/up, untrusted `up` rc, readiness gate, non-fatal smoke, per-instance FAILED).
#
# GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
# GitHub Variables: DEPLOY_INSTANCES (`dir:project` entries, space-separated). Unset ⇒ this job is
# SKIPPED (grey), not red — a fresh clone of the template has no instances yet.

name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ssh deploy (shared server + Traefik)
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_INSTANCES != '' }}
    environment: production
    steps:
      - name: Deploy over SSH
        # PINNED BY COMMIT SHA — see the long note in ci.yml. This action receives the production
        # SSH key; a mutable tag could be re-pointed by a compromised upstream and leak it.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        env:
          DEPLOY_INSTANCES: ${{ vars.DEPLOY_INSTANCES }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_INSTANCES
          # script_stop MUST stay false — see the long note in ci.yml. `true` injects `set -e` and
          # would abort the instance loop on the first non-zero command, dropping later instances.
          script_stop: false
          script: |
            set -uo pipefail   # NO `-e` on purpose (the loop must visit ALL instances).
            # Same incident-hardened flow as ci.yml: (1) build, (2) migrate, (3) up --no-build with
            # its rc recorded but NOT trusted, (4) readiness gate on api container health = the
            # source of truth. Real failures (build / migrate / api-not-healthy) still go red.
            INSTANCES="${DEPLOY_INSTANCES:-}"
            if [ -z "$INSTANCES" ]; then
              echo "::error title=No instances::DEPLOY_INSTANCES is empty"; exit 1
            fi
            FAILED=""
            for entry in $INSTANCES; do
              dir="${entry%%:*}"; proj="${entry##*:}"
              echo "[deploy] === instance dir=/opt/$dir project=$proj ==="
              cd "/opt/$dir" || { echo "::error title=cd failed ($proj)::/opt/$dir missing"; FAILED="$FAILED $proj"; continue; }
              echo "[deploy:$proj] git pull"
              if ! git pull --ff-only; then
                echo "::error title=git pull failed ($proj)::ff-only pull failed in /opt/$dir"; FAILED="$FAILED $proj"; continue
              fi
              echo "[deploy:$proj] build (image built on the server)"
              if ! docker compose -p "$proj" -f docker-compose.prod.yml --env-file .env build api migrate; then
                echo "::error title=build failed ($proj)::docker compose build returned non-zero"; FAILED="$FAILED $proj"; continue
              fi
              echo "[deploy:$proj] migrate (alembic upgrade head) — BEFORE api starts"
              if ! docker compose -p "$proj" -f docker-compose.prod.yml --env-file .env run --rm migrate; then
                echo "::error title=migrate failed ($proj)::alembic upgrade head returned non-zero"; FAILED="$FAILED $proj"; continue
              fi
              echo "[deploy:$proj] up -d --no-build (rc recorded, not trusted; the readiness gate decides)"
              up_rc=0
              docker compose -p "$proj" -f docker-compose.prod.yml --env-file .env up -d --no-build || up_rc=$?
              echo "[deploy:$proj] up rc=$up_rc (informational)"
              echo "[deploy:$proj] readiness gate: api container health (30 x 2s)"
              ready=0
              for i in $(seq 1 30); do
                h="$(docker inspect "${proj}-api-1" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
                if [ "$h" = "healthy" ]; then echo "[deploy:$proj] api healthy ($i)"; ready=1; break; fi
                echo "[deploy:$proj] api health=$h ($i/30) — retrying in 2s"; sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "::error title=api not healthy ($proj)::api did not become healthy within ~60s (up rc=$up_rc). Last logs:"
                docker logs "${proj}-api-1" --tail 40 2>&1 || true
                FAILED="$FAILED $proj"; continue
              fi
              inst_domain="$(grep -E '^SERVICE_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d '\"'"'"' ' || true)"
              if [ -z "$inst_domain" ]; then
                echo "::warning title=Smoke skipped ($proj)::no SERVICE_DOMAIN in /opt/$dir/.env"
              else
                url="https://$inst_domain/healthz"
                echo "[smoke:$proj] GET $url"
                smoke_ok=0
                for i in $(seq 1 12); do
                  if curl -fsS --max-time 5 "$url" >/dev/null; then echo "[smoke:$proj] healthz OK"; smoke_ok=1; break; fi
                  echo "[smoke:$proj] not ready ($i/12) — retrying in 5s"; sleep 5
                done
                if [ "$smoke_ok" -ne 1 ]; then
                  echo "::warning title=Smoke /healthz not green ($proj)::$url did not return 200 within 60s. Build+migrate+up succeeded and api is healthy in-container; DNS/ACME may still be settling."
                fi
              fi
            done
            echo "[deploy] prune dangling build layers (best-effort)"
            docker image prune -f || true
            if [ -n "$FAILED" ]; then
              echo "::error title=Deploy failed::instance(s) failed:$FAILED"
              exit 1
            fi
            echo "[deploy] all instances deployed and healthy"
