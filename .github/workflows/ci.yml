# CI gate: format / lint / types / tests / coverage gates / alert rules / image build.
# Any failure blocks merge AND blocks deploy.
#
# DEPLOY ORDERING: deploy lives in deploy.yml and is triggered by `workflow_run` of THIS workflow
# on `main`, only when it concluded `success`. It never runs in parallel with CI and never ships a
# red build (the incident a plain `push` trigger on deploy.yml would reintroduce).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.4.30"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: lint • format • types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: test • coverage gate
    runs-on: ubuntu-latest
    # Integration tests use testcontainers, which need a Docker daemon (present on ubuntu-latest).
    # No `services:` declared on purpose — testcontainers manages PostgreSQL/Redis itself.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      # Global gate: 80%.
      - name: Pytest + coverage (global gate 80%)
        run: >
          uv run pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      # Critical packages must hit >=95% EACH: policy, wallet, auth, generation and every billing*
      # package — everywhere a bug costs money or access.
      #
      # PER-PACKAGE, not aggregate. Passing all ten paths to a single `--cov-fail-under=95` would
      # gate their UNION: wallet at 85% would sail through on the back of policy at 99% — i.e. the
      # gate would be weakest exactly where it matters most. Instead we reuse the `.coverage` data
      # written by the global step above (so the suite runs ONCE, not twice) and assert each
      # package on its own, collecting failures so the log lists EVERY package below the bar.
      - name: Critical-package coverage gate (>=95% per package)
        run: |
          set -uo pipefail
          FAILED=""
          for p in policy wallet auth generation billing billing_common billing_adapty \
                   billing_cloudpayments subscription token_purchase; do
            echo "::group::coverage gate — app/$p (>=95%)"
            if ! uv run coverage report --include="src/app/$p/*" --fail-under=95 --show-missing; then
              FAILED="$FAILED $p"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error title=Coverage below 95%::package(s) under the critical gate:$FAILED"
            exit 1
          fi
          echo "all critical packages are >= 95%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Alert rules — FORM *and* BEHAVIOUR.
  #
  # `promtool check rules` only validates syntax. It cannot catch the bug class that actually keeps
  # happening in this ruleset: an alert over a metric nobody emits, a matcher blind to part of its
  # own class, two rules double-paging one series. Each is valid YAML and valid PromQL; each is
  # invisible to a reader. They surface ONLY by running the rules against series and observing what
  # fires — which is what `promtool test rules` does (infra/observability/rules/alerts_test.yml).
  #
  # This is a blocking gate, not a nicety: the alerts are the ONLY guard on the money path in prod,
  # and when they regress they go QUIET — indistinguishable from "everything is fine". `deploy`
  # needs this job, so a broken money alert cannot reach production.
  alerts:
    name: alert rules • syntax + behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pinned Prometheus image as the observability overlay — the validator matches what runs.
      - name: promtool check rules + test rules + check config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/infra/observability:/obs" \
            --entrypoint sh prom/prometheus:v2.54.1 -c '
              set -e
              cd /obs
              echo "== check rules (syntax) =="
              promtool check rules rules/alerts.yml
              echo "== test rules (behaviour) =="
              promtool test rules alerts_test.yml
              echo "== check config (scrape configs) =="
              # Mirrors the real prod mount: rules/ -> /etc/prometheus/rules, which both configs load
              # via the glob rule_files: /etc/prometheus/rules/*.yml. This is what proves no non-rule
              # file (e.g. the test file) has crept into that directory — one would make Prometheus
              # fail to load its config and the whole observability stack would refuse to start.
              # The scrape-token file is provisioned on the server and never committed; a dummy lets
              # promtool resolve the http_headers file reference.
              mkdir -p /etc/prometheus/secrets && echo dummy > /etc/prometheus/secrets/scrape_token
              cp -r /obs/rules /etc/prometheus/rules
              promtool check config /obs/prometheus.yml /obs/prometheus.prod.yml
            '

  build-image:
    name: build docker image (validation only)
    runs-on: ubuntu-latest
    needs: [quality, test]
    # The deployable image is BUILT ON THE SERVER, NOT pushed to
    # a registry. This job only VALIDATES that the Dockerfile builds — no registry login, no push
    # (hence no `packages: write`).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: service-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
