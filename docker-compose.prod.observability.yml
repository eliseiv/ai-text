# OPTIONAL production observability overlay — Prometheus scraping api /metrics on the shared
# server. Layered ON TOP of docker-compose.prod.yml
# (shares its `default` network and the `api` service):
#
#   docker compose -p <inst> -f docker-compose.prod.yml -f docker-compose.prod.observability.yml \
#     --env-file .env up -d --no-build
#
# Prometheus reaches `api:8000` over the internal `default` network by service name (api is NOT
# published). The scrape token VALUE is never committed: provide it on the server at
# infra/observability/secrets/scrape_token (gitignored, mounted read-only) and set the SAME value
# as METRICS_SCRAPE_TOKEN in .env. Prometheus is published on loopback only (127.0.0.1:9090) —
# never internet-facing and never on `web`/Traefik.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/rules:/etc/prometheus/rules:ro
      # Mount the DIRECTORY, not the token FILE (the token is gitignored and absent from a fresh
      # clone; bind-mounting a missing path would make Docker create a root-owned DIRECTORY there,
      # breaking Prometheus irrecoverably without `rm -rf`). The dir ships in the repo.
      - ./infra/observability/secrets:/etc/prometheus/secrets:ro
      - promdata:/prometheus
    # Cap the logs of the overlay too — same reason as the prod stack (shared disk).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Loopback only — local scraping/diagnostics on the host.
    ports:
      - "127.0.0.1:9090:9090"
    # Internal stack network only — NOT on `web` (Traefik).
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy

volumes:
  promdata:

networks:
  # Must match the network name in docker-compose.prod.yml so the overlay joins the same internal
  # network as `api` (compose prefixes it with the project name at runtime).
  default:
