# Local dev stack (topology, local equivalent).
# Config comes from .env (never committed); .env.example is the template.
#
# Everything instance-specific is parameterised, so a clone of this template needs no edit here:
#   COMPOSE_PROJECT_NAME -> image tag prefix        (default: service)
#   POSTGRES_DB          -> database name           (default: app)

services:
  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only — not exposed beyond the host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot migration job: `alembic upgrade head` runs to completion BEFORE api starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-service}-backend:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-service}-backend:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # In-compose service hostnames override the localhost defaults from .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FILES_DIR: /data/files
    volumes:
      - filedata:/data/files
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # App-level readiness (GET /ready checks DB + Redis).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # Background processing: import, indexing, answers, summaries, purges. Same image as api.
  worker:
    image: ${COMPOSE_PROJECT_NAME:-service}-backend:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FILES_DIR: /data/files
    volumes:
      - filedata:/data/files
    command: ["python", "-m", "app.domain.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  pgdata:
  redisdata:
  filedata:
